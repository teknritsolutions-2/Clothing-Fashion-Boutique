<!DOCTYPE html>
<html data-theme="light" dir="ltr" lang="en">
<head>
<meta charset="utf-8"><meta content="width=device-width, initial-scale=1" name="viewport">
<meta content="Sign in to your SÉRAINE account." name="description"><meta content="#68556A" name="theme-color">
<title>Login — SÉRAINE</title>
<link href="assets/images/seraine-mark.svg" rel="icon" type="image/svg+xml">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('seraine-theme')||'light';document.documentElement.dir=localStorage.getItem('seraine-dir')||'ltr'}catch(e){}</script>
<link href="assets/css/style.css" rel="stylesheet"><link href="assets/css/dark-mode.css" rel="stylesheet"><link href="assets/css/rtl.css" rel="stylesheet"><script defer src="assets/js/main.js"></script>
</head>
<body class="auth-body" data-page="login.html" id="top">
<a class="skip-link" href="#main">Skip to login</a>
<main class="auth-page" id="main">
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-card-tools"><a aria-label="SÉRAINE home" class="brand" href="index.html"><span aria-hidden="true" class="brand-mark"></span><span>SÉRAINE</span></a></div>
    <div class="auth-heading"><p class="eyebrow">YOUR SÉRAINE ACCOUNT</p><h1 id="auth-title">Welcome back</h1><p>Enter your details to continue.</p></div>
    <form id="login-form" data-auth-form="login" novalidate>
      <label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="login-password">Password</label><span class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required><button type="button" data-password-toggle="login-password" aria-label="Show password" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></span>
      <button class="button" type="submit">Login</button><p class="auth-status" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-switch">New to SÉRAINE? <a href="register.html">Create an account</a></p>
    <p class="auth-note">Online sign-in is coming soon. Details stay in your browser and are not sent or stored.</p>
    <a class="auth-home-link" href="index.html">← Back to home</a>
  </section>
</main>
</body>
</html>
